global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: retriever
    static_configs: [{targets: ["retriever:8001"]}]
  - job_name: llm-gateway
    static_configs: [{targets: ["llm-gateway:8002"]}]
  # agents are scaled with --scale: DNS A-record discovery scrapes every replica
  - job_name: triage-agent
    dns_sd_configs: [{names: ["triage-agent"], type: A, port: 9100, refresh_interval: 10s}]
  - job_name: coverage-agent
    dns_sd_configs: [{names: ["coverage-agent"], type: A, port: 9100, refresh_interval: 10s}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  # optional: per-container resource metrics from cAdvisor (compose profile "cadvisor")
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
