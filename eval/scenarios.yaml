# Fixed evaluation set (L3). Each scenario = base FNOL + overrides (deep-merged),
# the expected outcome, and the passage(s) that support it ("support": substrings
# that must appear in a passage retrieved during the run, taken verbatim from the
# Universal Sompo policy wording / prospectus, UIN IRDAN134RP0004V03200708).
#
# expect.outcome: routed | escalated | rejected
# expect.position / expect.route may be a list of acceptable values.
# Clause ids are not hard-coded so the set survives re-chunking; the support
# text is the stable reference.

base:
  contract_version: "1.0"
  claim_reference: FNOL-000000
  channel: app
  policy:
    policy_number: USGI/PC/2026/004512
    product_uin: IRDAN134RP0004V03200708
    policy_start_date: "2026-04-01"
    policy_end_date: "2027-03-31"
    vehicle_class: private_car
    idv_inr: 650000
    addons: []
  vehicle:
    registration_number: KA01AB1234
    make: Maruti Suzuki
    model: Swift VXI
    year_of_manufacture: 2022
    fuel_type: petrol
  incident:
    date_of_loss: "2026-10-20T19:30:00+05:30"
    reported_at: "2026-10-21T10:00:00+05:30"
    location: {city: Bengaluru, state: Karnataka, pincode: "560034"}
    description: "Placeholder description of the incident long enough to pass validation."
    police_report_filed: false
    fir_number: null
    third_party_involved: false
    injuries: none
    vehicle_driveable: true
    estimated_repair_cost_inr: 28000
    cashless_requested: true
  driver:
    driver_is_insured: true
    name: Arjun Rao
    licence_number: KA0120150012345
    licence_valid_until: "2035-05-01"
  claimant:
    name: Arjun Rao
    phone: "9876543210"
    email: arjun.rao@example.com

scenarios:
  - id: S01
    title: Minor own-damage scrape, cashless, small estimate
    overrides:
      incident:
        description: "While reversing out of my office parking basement I scraped a concrete pillar. The rear bumper is cracked and the left tail lamp is broken. Nobody else was involved."
        estimated_repair_cost_inr: 18000
    expect: {outcome: routed, claim_type: own_damage, position: [likely_covered, covered_with_conditions], route: fast_track}
    support: ["by accidental external means"]

  - id: S02
    title: Own damage collision with large estimate
    overrides:
      incident:
        description: "My car skidded on a wet road near Hosur Road flyover and hit the median. The front bumper, bonnet, radiator and both headlamps are damaged and the airbags deployed."
        estimated_repair_cost_inr: 185000
        vehicle_driveable: false
    expect: {outcome: routed, claim_type: own_damage, position: [likely_covered, covered_with_conditions], route: surveyor}
    support: ["by accidental external means"]

  - id: S03
    title: "THE DIFFICULT CASE (4.1): food delivery run in own private car"
    overrides:
      incident:
        description: "I was making a food delivery run in my own car when the accident happened. A bike cut in front of me at the Koramangala signal and I braked hard and hit the divider. Front bumper and left fender are damaged."
        estimated_repair_cost_inr: 42000
    expect: {outcome: routed, claim_type: own_damage, position: likely_not_covered, route: investigation}
    support: ["Limitations as to Use", "hire or reward"]

  - id: S04
    title: Ride-hailing - carrying paying passengers in a private car
    overrides:
      incident:
        description: "I drive my car on Uber in the evenings. I was carrying two passengers who had booked the ride when a truck sideswiped my car on Outer Ring Road. Right side doors are dented."
        estimated_repair_cost_inr: 55000
    expect: {outcome: routed, claim_type: own_damage, position: likely_not_covered, route: investigation}
    support: ["Limitations as to Use", "hire or reward"]

  - id: S05
    title: Theft of the car, FIR filed promptly
    overrides:
      incident:
        description: "My car was stolen from outside my house in Indiranagar overnight. I parked it at 11 pm and found it missing at 6 am. I have filed a police complaint."
        date_of_loss: "2026-10-20T23:30:00+05:30"
        reported_at: "2026-10-21T08:00:00+05:30"
        police_report_filed: true
        fir_number: "FIR-0457/2026"
        estimated_repair_cost_inr: null
        cashless_requested: false
        vehicle_driveable: false
    expect: {outcome: routed, claim_type: theft, position: [likely_covered, covered_with_conditions], route: investigation}
    support: ["burglary housebreaking or theft"]

  - id: S06
    title: Theft intimated three days late
    overrides:
      incident:
        description: "My car was stolen from the mall parking at Whitefield. I was travelling and could only inform the insurer now. Police complaint has been filed."
